[package]
name = "minecraft-manager"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "minecraft-manager"
path = "src/main.rs"

[[bin]]
name = "hash_password"
path = "src/bin/hash_password.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower-sessions = "0.15"
tower-sessions-memory-store = "0.15"
tower_governor = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5"
sysinfo = "0.30"
nix = { version = "0.29", features = ["signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
futures-util = "0.3"
chrono = "0.4"
bcrypt = "0.15"
cookie = "0.18"
time = "0.3"
